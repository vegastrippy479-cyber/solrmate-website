<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Our Projects - SOlrmate</title>

<style>
body {
    font-family: Arial, sans-serif;
    margin: 0;
    background: #f4f4f4;
}

/* HEADER */
.header {
    background: orange;
    padding: 15px;
    text-align: center;
    font-weight: bold;
    font-size: 20px;
}

/* BACK BUTTON */
.back {
    display: inline-block;
    margin: 20px;
    padding: 10px 20px;
    background: orange;
    color: black;
    text-decoration: none;
    border-radius: 5px;
    font-weight: bold;
}

/* GALLERY GRID */
.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 15px;
    padding: 20px;
}

/* IMAGES */
.gallery img {
    width: 100%;
    border-radius: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
    cursor: pointer;
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}

/* FULLSCREEN VIEW */
.fullscreen {
    position: fixed;
    display: none;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
    z-index: 2000;
}

.fullscreen img {
    max-width: 90%;
    max-height: 90%;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">Our Solar Projects</div>

<a href="index.html" class="back">⬅ Back Home</a>

<!-- GALLERY -->
<div class="gallery">
    <img src="solar1.jpg" onclick="openImage(this.src)">
    <img src="solar2.jpg" onclick="openImage(this.src)">
    <img src="solar3.jpg" onclick="openImage(this.src)">
    <img src="solar4.jpg" onclick="openImage(this.src)">
    <img src="solar5.jpg" onclick="openImage(this.src)">
    <img src="solar6.jpg" onclick="openImage(this.src)">
    <img src="solar7.jpg" onclick="openImage(this.src)">
</div>

<!-- FULLSCREEN IMAGE -->
<div class="fullscreen" id="viewer" onclick="closeImage()">
    <img id="fullImg">
</div>

<script>
function openImage(src) {
    document.getElementById("viewer").style.display = "flex";
    document.getElementById("fullImg").src = src;
}

function closeImage() {
    document.getElementById("viewer").style.display = "none";
}
</script>

</body>
</html
